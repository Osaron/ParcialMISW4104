<div class="page-container">
  
  <div class="page-header">
    <h1 class="page-title">Directorio de Usuarios</h1>
    <p class="page-subtitle">Gestiona y explora el talento de los equipos de ingeniería activos.</p>
  </div>

  <div class="content-flex" [class.drawer-open]="selected">
    <!-- Grid de Usuarios (Maestro) -->
    <div class="cards-grid-wrapper">
      <div class="cards-grid">
        <div *ngFor="let usuario of usuarios">
          
          <div 
            class="user-card" 
            (click)="onSelected(usuario)"
            [class.selected-card]="selected && selectedUsuario.id === usuario.id">
            
            <div class="card-status-bar">
              <span class="status-badge status-{{usuario.role}}">{{ usuario.role | uppercase }}</span>
            </div>

            <div class="user-info">
              <img class="avatar" src="{{ usuario.avatarUrl }}" alt="{{ usuario.name }}" />
              <div>
                <h3 class="user-name">{{ usuario.name }}</h3>
                <p class="user-meta">{{ usuario.role | titlecase }} • {{ usuario.location }}</p>
              </div>
            </div>

            <div class="tags-container">
              <span class="skill-tag" *ngIf="usuario.role === 'developer'">TypeScript</span>
              <span class="skill-tag" *ngIf="usuario.role === 'developer'">React</span>
              <span class="skill-tag" *ngIf="usuario.role === 'admin'">DevOps</span>
              <span class="skill-tag" *ngIf="usuario.role === 'designer'">Figma</span>
            </div>

            <div class="card-footer-meta">
              <div class="mock-avatars">
                <div class="mock-avatar"></div>
                <div class="mock-avatar"></div>
              </div>
              <span class="repo-count">{{ usuario.repoIds.length }} repos compartidos</span>
            </div>

            <div class="mt-3 pt-3 border-top d-flex justify-content-between align-items-center">
                <span class="text-primary small fw-bold">Ver detalles</span>
                <i class="bi bi-arrow-right text-primary"></i>
            </div>

          </div>
        </div>
      </div>
    </div>

    <!-- Panel Lateral de Detalle -->
    <div class="side-drawer" *ngIf="selected">
      <app-usuario-detail [usuarioDetail]="selectedUsuario" (close)="selected = false"></app-usuario-detail>
    </div>
  </div>

</div>
