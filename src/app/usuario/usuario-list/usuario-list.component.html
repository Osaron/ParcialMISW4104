<div class="container-fluid mt-4">
  <div class="row">
    <div class="col-md-3 col-sm-6 mb-4" *ngFor="let usuario of usuarios">
      <div class="card h-100 p-3 shadow-sm border-0 user-card">
        <div class="text-center">
          <img
            class="card-img-top rounded-circle mt-2 mb-3"
            src="{{ usuario.avatarUrl }}"
            alt="{{ usuario.name }}"
          />
        </div>
        <div class="card-body text-center p-0">
          <h5 class="card-title fw-bold mb-1">{{ usuario.name }}</h5>
          <p class="text-muted small mb-2">&#64;{{ usuario.username }}</p>
          <span class="badge rounded-pill" 
                [ngClass]="{
                  'bg-primary': usuario.role === 'admin',
                  'bg-success': usuario.role === 'developer',
                  'bg-warning text-dark': usuario.role === 'designer'
                }">
            {{ usuario.role | titlecase }}
          </span>
          <p class="card-text small mt-3 mb-1">
            <i class="bi bi-geo-alt-fill text-danger"></i> {{ usuario.location }}
          </p>
          <p class="card-text small text-muted">
             {{ usuario.repoIds.length }} repositorios
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
