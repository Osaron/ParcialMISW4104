<div class="container-fluid">
  <div class="text-center mb-5">
    <h2 class="display-5 fw-bold text-dark">Explorar Repositorios</h2>
    <p class="text-muted fs-5">Descubre los proyectos de nuestros usuarios destacados.</p>
  </div>

  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-4">
    <div class="col" *ngFor="let repo of repositorios">
      <div class="card h-100 repo-card border-0 shadow-sm">
        
        <div class="card-header bg-transparent border-0 pt-4 pb-0">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="badge rounded-pill bg-light text-dark border px-3 py-2 fs-6">
              <i class="bi bi-code-slash text-primary me-1"></i> {{ repo.language }}
            </span>
            <div class="stars-badge text-warning fw-bold fs-6">
              <i class="bi bi-star-fill"></i> {{ repo.stars }}
            </div>
          </div>
          <h4 class="card-title fw-bold text-truncate mt-3" title="{{ repo.name }}">
            {{ repo.name }}
          </h4>
        </div>

        <div class="card-body">
          <p class="card-text text-secondary line-clamp-3">
            {{ repo.description }}
          </p>
        </div>

        <div class="card-footer bg-transparent border-top-0 pb-4">
          <hr class="mt-0 mb-3 opacity-25">
          <div class="d-flex justify-content-between align-items-center text-muted small">
            <span title="Owner ID">
              <i class="bi bi-person-badge"></i> Owner: #{{ repo.ownerId }}
            </span>
            <span>
              <i class="bi bi-calendar3"></i> {{ repo.createdAt | date:'mediumDate' }}
            </span>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
