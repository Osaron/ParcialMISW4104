<div class="page-container">
  
  <div class="page-header">
    <h1 class="page-title">Explorador de Repositorios</h1>
    <p class="page-subtitle">Descubre y gestiona los activos de código de toda la organización.</p>
  </div>

  <div class="content-flex">
    <!-- Grid de Repositorios -->
    <div class="cards-grid-wrapper">
      <div class="cards-grid">
        <div *ngFor="let repo of repositorios">
          
          <div class="repo-card" (click)="onSelected(repo)" [class.selected-card]="isRepoSelected(repo)">
            
            <div class="card-status-bar">
              <div class="icon-square">
                <i class="bi bi-folder2-open"></i>
              </div>
              <span class="stars-badge">
                <i class="bi bi-star-fill text-warning"></i> {{ repo.stars }}
              </span>
            </div>

            <div class="repo-info">
              <h3 class="repo-name">{{ repo.name }}</h3>
              <p class="repo-desc">{{ repo.description || 'Un sistema de diseño de alta velocidad inspirado en glassmorphism.' }}</p>
            </div>

            <div class="tags-container">
              <span class="skill-tag">{{ repo.language }}</span>
              <span class="meta-tag"><span class="dot"></span> Principal</span>
            </div>

            <div class="mt-auto pt-3 border-top d-flex justify-content-between align-items-center" style="margin-top: 1rem;">
                <span class="text-primary small fw-bold">Ver detalles</span>
                <i class="bi bi-arrow-right text-primary"></i>
            </div>

          </div>
        </div>
      </div>
    </div>

    <!-- Panel Lateral de Detalle (child route) -->
    <div class="side-drawer-container">
      <router-outlet></router-outlet>
    </div>
  </div>

</div>
